# Render Blueprint — one-click deploy of the Football Predictor.
# In Render: New → Blueprint → connect this repo. Render reads this file.
services:
  - type: web
    name: football-predictor
    runtime: docker
    # 'free' (512MB) to start with no charge; if the ML models OOM or cold-starts
    # annoy you, bump to 'starter' (~$7/mo) in the Render dashboard.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: API_FOOTBALL_KEY   # optional: set to enable the live club "Today" tab
        sync: false
